[package]
name = "backend"
version = "0.1.0"

[build]
outputDir = "src/backend/dist"
args = [ "--release" ]

[canisters.backend]
main = "src/backend/main.mo"

  [canisters.backend.check-stable]
  path = ".old/src/backend/dist/backend.most"

[toolchain]
moc = "1.3.0"
lintoko = "0.7.0"

[lint]
extends = true

[moc]
args = [
  "--default-persistent-actors",
  "--actor-idl=src/backend/system-idl",
  "--implicit-package=core",
  "-no-check-ir",
  "-E=M0236,M0235,M0223,M0237",
  # M0198 = "unused identifier". Suppressed globally, and this is deliberate:
  # ~9 stable vars (sGLDTTreasuryBalance, batPoolBalance, bridgeRequests,
  # sGLDTRequests, cachedBatPrice, cachedSGldtPrice, ckUNIMinter, ...) are dead
  # in the code but still present in the LIVE canister's stable signature —
  # see `stable var` entries in src/backend/dist/backend.most.
  #
  # Do NOT "clean these up". Motoko matches stable variables BY NAME, so
  # renaming one to `_name` to silence the warning drops it from the signature
  # and discards that state on the next upgrade of a canister holding real
  # funds. Deleting them has the same effect.
  #
  # The cost of the global flag is that genuine unused-identifier warnings are
  # hidden too. Accepted knowingly: the alternative is a per-identifier
  # suppression that does not exist for stable vars in moc 1.3.0.
  "-A=M0198"
]

[dependencies]
core = "2.2.0"
caffeineai-authorization = "0.1.0"
caffeineai-http-outcalls = "0.1.0"
