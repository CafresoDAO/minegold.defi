<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#111111"/>

  <!-- Pickaxe handle — bright warm brown, thick diagonal for readability -->
  <line x1="8" y1="26" x2="26" y2="8" stroke="#C17A2A" stroke-width="4" stroke-linecap="round"/>

  <!-- Pickaxe head body — bright iron/silver bar, perpendicular-ish -->
  <line x1="18" y1="5" x2="31" y2="18" stroke="#E8E8E8" stroke-width="6" stroke-linecap="square"/>

  <!-- Pick spike tip (sharp end, upper-right) -->
  <polygon points="28,4 32,8 31,10 27,7" fill="#CCCCCC"/>
  <!-- Spike highlight -->
  <line x1="29" y1="5" x2="32" y2="8" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Peen (blunt butt end, lower-left of head) -->
  <rect x="16" y="16" width="6" height="5" rx="1" fill="#BBBBBB"/>

  <!-- Gold ore block — bottom-left, bright gold so it pops -->
  <rect x="1" y="21" width="11" height="10" rx="1.5" fill="#8B6914"/>
  <!-- Gold veins on ore -->
  <rect x="2" y="22" width="4" height="3" fill="#FFD700"/>
  <rect x="7" y="23" width="3" height="2" fill="#F5C542"/>
  <rect x="3" y="26" width="6" height="3" fill="#DAA520"/>
  <rect x="1" y="29" width="11" height="2" rx="1" fill="#6B4F10"/>

  <!-- Gold spark at pick tip — makes it obvious this is mining gold -->
  <circle cx="30" cy="6" r="2.5" fill="#FFD700" opacity="0.95"/>
  <circle cx="28" cy="8" r="1.2" fill="#FFFACD" opacity="0.85"/>
</svg>
