<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Gold plate, matching the in-app brand badge -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CA8A04"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#plate)"/>

  <!-- Stacked ingots — same geometry as MinegoldMark.tsx, scaled 40→32
       (x0.8) and nudged for optical centring on the smaller plate. -->
  <path d="M5.6 24.4 L8 18.4 H15.6 L18 24.4 Z" fill="#3B2400"/>
  <path d="M19 24.4 L21.4 18.4 H29 L31.4 24.4 Z" fill="#4A2E00" transform="translate(-4.4 0)"/>
  <path d="M11.6 16.4 L14 10.4 H21.6 L24 16.4 Z" fill="#5C3A00"/>
  <path d="M14.8 12 H20" stroke="rgba(255,255,255,0.55)" stroke-width="1.3" stroke-linecap="round"/>
</svg>
