name: ci

# Runs the money-path unit tests and a typecheck on every push and PR.
#
# The point is that anyone reading this repo can see these ran, and see them
# fail when they should — a test suite whose results only exist on the
# maintainer's laptop asks for the same trust the rest of this project
# spends its time trying not to require.
#
# Read-only by design: no secrets, no deploy, no canister calls. Shipping to
# mainnet stays a deliberate human act (scripts/upgrade-backend.sh, which
# demands a typed confirmation).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  frontend:
    name: frontend — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      # `npm ci` installs exactly the lockfile — the same tree a reviewer
      # gets when they clone. `npm install` could silently resolve something
      # newer and make CI pass against code nobody else is running.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # A build failure is a real failure: the deployed artifact is built
      # from this exact command.
      - name: Build
        run: npm run build

  backend:
    name: backend — compile + stable-compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Same compiler the committed wasm was built with. `mops toolchain use`
      # downloads and selects it; `mops toolchain bin` prints its path so the
      # exact flags from README → Development can be reused verbatim.
      - name: Install mops + moc 1.3.0
        run: |
          npm install -g ic-mops
          mops toolchain use moc 1.3.0
          mops install

      # Compile to a scratch dir — never over the committed dist/. The
      # committed artifacts are what gets deployed; CI's job is to prove
      # main.mo still compiles and still fits the stable-variable layout
      # that is live, not to regenerate them.
      - name: Compile
        run: |
          MOC=$(mops toolchain bin moc)
          mkdir -p /tmp/ci-build
          $MOC --release --default-persistent-actors --actor-idl=system-idl \
            --implicit-package=core -no-check-ir -E=M0236,M0235,M0223,M0237 -A=M0198 \
            $(mops sources) -o /tmp/ci-build/backend.wasm --idl --stable-types main.mo

      # dist/backend.most is the layout of the last committed build. A
      # change that cannot upgrade over it would fail on mainnet with a
      # stable-compatibility error — better to fail here.
      - name: Stable-compatibility against committed layout
        run: |
          MOC=$(mops toolchain bin moc)
          $MOC --stable-compatible dist/backend.most /tmp/ci-build/backend.most

      # The committed artifacts must describe the same program main.mo
      # produces. The wasm itself is NOT byte-identical across macOS (where
      # dist/ is built) and Linux (here) — moc's output differs early in the
      # binary — so comparing it is a false red on every push. The candid
      # interface and the stable-variable layout are textual and
      # deterministic; if main.mo gained a method or a stable var without a
      # rebuild, one of these two differs.
      - name: Committed interface and stable layout match source
        run: |
          diff <(sort /tmp/ci-build/backend.did) <(sort dist/backend.did) \
            || { echo "::error::dist/backend.did does not match main.mo's interface — rebuild and commit dist/"; exit 1; }
          diff /tmp/ci-build/backend.most dist/backend.most \
            || { echo "::error::dist/backend.most does not match main.mo's stable layout — rebuild and commit dist/"; exit 1; }
          if ! cmp -s /tmp/ci-build/backend.wasm dist/backend.wasm; then
            echo "::notice::dist/backend.wasm differs byte-wise from this build (expected across OSes); interface and stable layout match."
          fi
